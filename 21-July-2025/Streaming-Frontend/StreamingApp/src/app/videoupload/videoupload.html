<form
  [formGroup]="uploadForm"
  (ngSubmit)="upload()"
  class="upload-card"
  novalidate
>
  <h2 class="upload-title">Upload Training Video</h2>

  <div class="form-group">
    <label>Title</label>
    <input
      type="text"
      formControlName="title"
      [class.invalid]="isInvalid('title')"
    />
    <div class="error-msg" *ngIf="isInvalid('title')">
      <small *ngIf="uploadForm.get('title')?.errors?.['required']"
        >Title is required</small
      >
      <small *ngIf="uploadForm.get('title')?.errors?.['maxlength']"
        >Max 100 characters</small
      >
    </div>
  </div>

  <div class="form-group">
    <label>Description</label>
    <textarea
      formControlName="description"
      [class.invalid]="isInvalid('description')"
    ></textarea>
    <div class="error-msg" *ngIf="isInvalid('description')">
      <small *ngIf="uploadForm.get('description')?.errors?.['required']"
        >Description is required</small
      >
      <small *ngIf="uploadForm.get('description')?.errors?.['maxlength']"
        >Max 500 characters</small
      >
    </div>
  </div>

  <div class="form-group">
    <label>Video File</label>
    <input type="file" #fileInput (change)="onFileChange($event)" />
    <div class="error-msg" *ngIf="isInvalid('videoFile')">
      <small *ngIf="uploadForm.get('videoFile')?.errors?.['required']"
        >Video file is required</small
      >
      <small *ngIf="uploadForm.get('videoFile')?.errors?.['invalidType']"
        >Only video files allowed</small
      >
    </div>
  </div>

  <button type="submit">
    <span *ngIf="!isUploading">Upload</span>
    <span *ngIf="isUploading" class="spinner"></span>
  </button>

  <div class="status-card success" *ngIf="uploadSuccess">
    <p>Upload successful!</p>
  </div>

  <div class="status-card error" *ngIf="uploadError">
    <p>{{ uploadError }}</p>
  </div>
</form>
